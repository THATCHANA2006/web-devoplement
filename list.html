```html
<!DOCTYPE html>
<html>
<head>
    <title>My List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
        }

        ul {
            display: inline-block;
            text-align: left;
            border: 2px solid black;
            padding: 20px 40px;
            background-color: white;
        }

        button {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>My List</h2>

    <ul id="myList">
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <br><br>

    <button onclick="addItem()">Click Me</button>

    <script>
        function addItem() {
            let li = document.createElement("li");
            li.innerHTML = "JavaScript";
            document.getElementById("myList").appendChild(li);
        }
    </script>

</body>
</html>
